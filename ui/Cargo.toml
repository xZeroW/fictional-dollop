[package]
name = "ui"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { workspace = true }
bevy-inspector-egui = { version = "0.37.0", optional = true }
bevy_asset_loader = { version = "0.27.0", features = ["2d", "standard_dynamic_assets"] }
bevy_feathers = "0.19.0"
engine = { path = "../engine", default-features = false }

[features]
dev = [
    "dep:bevy-inspector-egui",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
]
